name: ChatGPT Plugins Crawl Probe

on:
  workflow_dispatch:
    inputs:
      category_limit:
        description: "分类数量（1–16），默认先验证 2 个分类"
        required: true
        default: "2"
        type: string
      detail_limit:
        description: "详情采样数量（0–100）"
        required: true
        default: "10"
        type: string
      max_scrolls:
        description: "每个分类最大滚动次数（5–100）"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: chatgpt-plugins-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        browser_mode: [chromium-headed]
    defaults:
      run:
        working-directory: .github/scripts/chatgpt-plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/scripts/chatgpt-plugins/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check crawler helpers and syntax
        run: |
          npm test
          node --check crawl.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe public plugin pages
        env:
          BROWSER_MODE: ${{ matrix.browser_mode }}
          CATEGORY_LIMIT: ${{ github.event.inputs.category_limit || '2' }}
          DETAIL_LIMIT: ${{ github.event.inputs.detail_limit || '10' }}
          MAX_SCROLLS: ${{ github.event.inputs.max_scrolls || '30' }}
          OUTPUT_DIR: ${{ github.workspace }}/chatgpt-plugin-results
        run: xvfb-run -a npm run crawl
      - name: Upload results and failure screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatgpt-plugins-probe-${{ matrix.browser_mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: chatgpt-plugin-results/
          if-no-files-found: warn
          retention-days: 7

