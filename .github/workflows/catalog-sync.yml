name: Plugin Catalog Full and Incremental Sync
permissions:
  contents: write
  id-token: write
concurrency:
  group: plugin-catalog-pipeline
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      STATE_DIR: ${{ github.workspace }}
      OUTPUT_DIR: ${{ github.workspace }}/catalog-results
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://plugin.ipotatouv.chatgpt.site' }}
      SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
    defaults:
      run:
        working-directory: .github/scripts/chatgpt-plugins
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: main
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: .github/scripts/chatgpt-plugins/package-lock.json
    - name: Install and verify pipeline
      id: verify
      run: 'npm ci --ignore-scripts

        node --test *.test.mjs

        for file in *.mjs; do node --check "$file"; done

        '
    - name: Select operation
      id: operation
      env: &id001
        REQUESTED_MODE: ${{ github.event.inputs.mode }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_SCHEDULE: ${{ github.event.schedule }}
      run: node pipeline.mjs
    - name: Install Chromium
      if: steps.operation.outputs.mode == 'incremental' || steps.operation.outputs.mode == 'full'
      run: npx playwright install --with-deps chromium
    - name: Collect original data
      if: steps.operation.outputs.mode == 'incremental' || steps.operation.outputs.mode == 'full'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        DETAIL_LIMIT: ${{ github.event.inputs.detail_limit || '10000' }}
        MAX_MINUTES: ${{ github.event.inputs.max_minutes || '210' }}
        MAX_SCROLLS: '250'
        ALLOW_LARGE_REMOVALS: ${{ github.event.inputs.allow_large_removals || 'false' }}
        MODE: ${{ steps.operation.outputs.mode }}
        PIPELINE_STAGE: collect
      run: xvfb-run -a node run.mjs
      id: execute
      continue-on-error: true
    - name: Persist progress and publication manifest to main
      if: always() && steps.verify.outcome == 'success' && steps.execute.outcome != 'skipped'
      id: persist
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node state.mjs
    - name: Plan downstream jobs
      id: plan
      if: always() && steps.verify.outcome == 'success' && (steps.execute.outcome == 'skipped' || steps.persist.outcome == 'success')
      env: *id001
      run: node pipeline.mjs
    - name: Report stage failure
      if: always() && steps.execute.outcome == 'failure'
      run: exit 1
    - name: Upload progress and diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: collect-${{ github.run_id }}-${{ github.run_attempt }}
        path: catalog-results/
        if-no-files-found: warn
        retention-days: 7
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      mode: ${{ steps.plan.outputs.mode }}
      needs_translation: ${{ steps.plan.outputs.needs_translation }}
      needs_publish: ${{ steps.plan.outputs.needs_publish }}
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      STATE_DIR: ${{ github.workspace }}
      OUTPUT_DIR: ${{ github.workspace }}/catalog-results
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://plugin.ipotatouv.chatgpt.site' }}
      SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
    defaults:
      run:
        working-directory: .github/scripts/chatgpt-plugins
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: main
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: .github/scripts/chatgpt-plugins/package-lock.json
    - name: Install and verify pipeline
      id: verify
      run: 'npm ci --ignore-scripts

        node --test *.test.mjs

        for file in *.mjs; do node --check "$file"; done

        '
    - name: Apply reviewed translation repairs
      run: node repair-reviewed.mjs
    - name: Translate pending original versions
      env:
        GITHUB_TOKEN: ${{ github.token }}
        AI_TRANSLATION_BACKEND: ${{ vars.AI_TRANSLATION_BACKEND || 'workers-ai' }}
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
        AI_BASE_URL: ${{ vars.AI_BASE_URL || secrets.AI_BASE_URL }}
        AI_MODEL: ${{ vars.AI_MODEL || secrets.AI_MODEL }}
        WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
        AI_CONCURRENCY: ${{ vars.AI_CONCURRENCY || '3' }}
        AI_MAX_RETRIES: ${{ vars.AI_MAX_RETRIES || '4' }}
        AI_RETRY_BASE_MS: ${{ vars.AI_RETRY_BASE_MS || '2000' }}
        AI_REQUEST_TIMEOUT_MS: ${{ vars.AI_REQUEST_TIMEOUT_MS || '120000' }}
        AI_USER_AGENT: ${{ vars.AI_USER_AGENT }}
        AI_ORIGINATOR: ${{ vars.AI_ORIGINATOR || 'codex_cli_rs' }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_AI_DAILY_NEURON_LIMIT: ${{ vars.CLOUDFLARE_AI_DAILY_NEURON_LIMIT || '8500' }}
        CLOUDFLARE_AI_USAGE_CHECK_EVERY: ${{ vars.CLOUDFLARE_AI_USAGE_CHECK_EVERY || '5' }}
        MODE: translate
        DETAIL_LIMIT: ${{ github.event.inputs.detail_limit || '10000' }}
        TRANSLATION_LIMIT: ${{ github.event.inputs.translation_limit || (github.event_name == 'push' && '10') || vars.AI_TRANSLATION_LIMIT || '50' }}
        MAX_MINUTES: ${{ github.event.inputs.max_minutes || '210' }}
        MAX_SCROLLS: '250'
        ALLOW_LARGE_REMOVALS: ${{ github.event.inputs.allow_large_removals || 'false' }}
      run: node run.mjs
      id: execute
      continue-on-error: true
    - name: Persist progress and publication manifest to main
      if: always() && steps.verify.outcome == 'success'
      id: persist
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node state.mjs
    - name: Plan publication
      id: plan
      if: always() && steps.persist.outcome == 'success'
      env: *id001
      run: node pipeline.mjs
    - name: Report stage failure
      if: always() && steps.execute.outcome == 'failure'
      run: exit 1
    - name: Upload progress and diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: translate-${{ github.run_id }}-${{ github.run_attempt }}
        path: catalog-results/
        if-no-files-found: warn
        retention-days: 7
    needs: collect
    if: ${{ !cancelled() && needs.collect.outputs.ready == 'true' && needs.collect.outputs.needs_translation == 'true' }}
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      needs_publish: ${{ steps.plan.outputs.needs_publish }}
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STATE_DIR: ${{ github.workspace }}
      OUTPUT_DIR: ${{ github.workspace }}/catalog-results
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://plugin.ipotatouv.chatgpt.site' }}
      SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
    defaults:
      run:
        working-directory: .github/scripts/chatgpt-plugins
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: main
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: .github/scripts/chatgpt-plugins/package-lock.json
    - name: Install and verify pipeline
      id: verify
      run: 'npm ci --ignore-scripts

        node --test *.test.mjs

        for file in *.mjs; do node --check "$file"; done

        '
    - name: Synchronize Sites D1 and R2 using repository identity
      env:
        GITHUB_EVENT_INPUTS_MODE: ${{ github.event.inputs.mode }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node sync.mjs
    needs:
    - collect
    - translate
    if: ${{ !cancelled() && needs.collect.outputs.ready == 'true' && (needs.translate.result == 'skipped' || needs.translate.outputs.ready == 'true') && (needs.collect.outputs.needs_publish == 'true' || needs.translate.outputs.needs_publish == 'true') }}
  benchmark:
    needs: [translate, publish]
    if: ${{ !cancelled() && needs.translate.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STATE_DIR: ${{ github.workspace }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_DAILY_NEURON_LIMIT: ${{ vars.CLOUDFLARE_AI_DAILY_NEURON_LIMIT || '8500' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: main
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
    - name: Resume fixed 50-sample comparison
      run: node .github/scripts/chatgpt-plugins/benchmark.mjs
    - name: Save benchmark checkpoint
      if: always()
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node --input-type=module -e "import('./.github/scripts/chatgpt-plugins/state.mjs').then(m=>m.persist())"
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: full 刷新全部正文；incremental 续跑与变化更新；translate 仅补译；sync 仅同步已保存目录与图标
        default: incremental
        type: choice
        options:
        - incremental
        - full
        - translate
        - sync
      detail_limit:
        description: 本次最多抓取详情（0–20000），默认覆盖全量队列
        default: '10000'
        type: string
      translation_limit:
        description: 本轮最多翻译插件数（0–20000；0 表示不限）
        default: '250'
        type: string
      max_minutes:
        description: 任务预算分钟（1–240），到点保存进度
        default: '210'
        type: string
      allow_large_removals:
        description: 仅确认目录真实减少超过 20% 后启用；仍需两次完整扫描
        default: false
        type: boolean
  schedule:
  - cron: 0 0 * * *
  - cron: 0 4,8,12 * * *
  push:
    branches:
    - main
    paths:
    - .github/scripts/chatgpt-plugins/**
    - .github/workflows/catalog-sync.yml
    - package.json
